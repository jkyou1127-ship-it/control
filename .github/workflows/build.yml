name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Receiver tests
        run: python3 receiver/test_receiver.py
      - name: Panel script tests
        run: python3 scripts/test_panel.py
      - name: Relay tests
        run: node --test relay/test.mjs
      - name: Windows receiver
        run: scripts/build-receiver.sh
      - name: Unit tests and APK
        run: ./gradlew testReleaseUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ControlPad
          path: |
            app/build/outputs/apk/release/app-release.apk
            release/ControlPadReceiver.exe

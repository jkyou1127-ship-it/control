name: Panel request

# 평가단의 정식 추가 요청을 5분 뒤 release/ 에 반영한다. 요청은 두 길로 온다.
#   relay  앱 → 중계 서버(relay/worker.js, 평가단 코드 확인) → 이 워크플로 실행. 취소하려면 5분 안에 이 실행을 취소한다.
#   요청 종류: 빌드 정식 추가, 실험실 기능 정식 추가 · 숨김 · 복귀.
#   issue  GitHub 이슈(중계 서버를 쓰지 않을 때). 평가단 계정의 이슈만 받는다. 취소하려면 5분 안에 이슈를 닫는다.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "build, lab, hide, restore 중 하나"
        required: true
      target:
        description: "빌드 버전 또는 실험실 기능 이름"
        required: true
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# 요청마다 따로 실행된다. (concurrency 로 줄을 세우면 기다리는 요청이 하나만 남고 나머지가 취소되므로 쓰지 않는다.)

jobs:
  relay:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # 입력값은 명령에 끼워 넣지 않고 환경 변수로만 넘기고, scripts/panel.py 가 모양을 다시 확인한다.
      REQUEST_KIND: ${{ inputs.kind }}
      REQUEST_TARGET: ${{ inputs.target }}
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the request
        id: check
        run: python3 scripts/panel.py check >> "$GITHUB_OUTPUT"

      - name: Reject
        if: steps.check.outputs.ok != 'true'
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "요청을 반영하지 않았습니다: $REASON" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Remember the requested alpha build
        if: steps.check.outputs.ok == 'true'
        run: |
          # 기다리는 사이에 새 알파가 올라와도 요청한 그 빌드를 올릴 수 있게 지금 알파 빌드를 떠 둔다.
          mkdir -p "$RUNNER_TEMP/alpha"
          cp release/alpha/version.json release/alpha/ControlPad.apk "$RUNNER_TEMP/alpha/"
          echo "ALPHA_SNAPSHOT=$RUNNER_TEMP/alpha" >> "$GITHUB_ENV"

      - name: Wait five minutes
        run: sleep 300

      - name: Apply
        run: |
          # 여러 요청이 겹쳐도 서로 지우지 않게, 밀리면 최신 상태에서 다시 반영한다.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            if ! result=$(python3 scripts/panel.py apply 2>&1); then
              echo "요청을 반영하지 않았습니다: $result" >> "$GITHUB_STEP_SUMMARY"; exit 1
            fi
            git add release
            git commit -q -m "Panel request: $result"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "$result" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep $((attempt * 3 + RANDOM % 5))
          done
          echo "다른 변경과 계속 겹쳐서 반영하지 못했습니다" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  promote:
    if: >-
      github.event_name == 'issues' && (startsWith(github.event.issue.title, '[정식 요청]') ||
      startsWith(github.event.issue.title, '[숨김 요청]') || startsWith(github.event.issue.title, '[복귀 요청]'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # 이슈 제목과 작성자는 누구나 정할 수 있는 값이다. 명령에 끼워 넣지 않고 환경 변수로만 넘긴다.
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the request
        id: check
        run: python3 scripts/panel.py check >> "$GITHUB_OUTPUT"

      - name: Reject
        if: steps.check.outputs.ok != 'true'
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          gh issue close "$ISSUE_NUMBER" --reason "not planned" --comment "요청을 반영하지 않았습니다: $REASON"

      - name: Announce
        if: steps.check.outputs.ok == 'true'
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "요청을 받았습니다. 5분 뒤에 $SUMMARY 올립니다. 취소하려면 그 전에 이 이슈를 닫으세요."

      - name: Remember the requested alpha build
        if: steps.check.outputs.ok == 'true'
        run: |
          # 기다리는 사이에 새 알파가 올라와도 요청한 그 빌드를 올릴 수 있게 지금 알파 빌드를 떠 둔다.
          mkdir -p "$RUNNER_TEMP/alpha"
          cp release/alpha/version.json release/alpha/ControlPad.apk "$RUNNER_TEMP/alpha/"
          echo "ALPHA_SNAPSHOT=$RUNNER_TEMP/alpha" >> "$GITHUB_ENV"

      - name: Wait five minutes
        if: steps.check.outputs.ok == 'true'
        run: sleep 300

      - name: Apply
        if: steps.check.outputs.ok == 'true'
        run: |
          if [ "$(gh issue view "$ISSUE_NUMBER" --json state --jq .state)" != "OPEN" ]; then
            echo "이슈가 닫혀서 취소되었습니다"
            exit 0
          fi
          # 여러 요청이 겹쳐도 서로 지우지 않게, 밀리면 최신 상태에서 다시 반영한다.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            if ! result=$(python3 scripts/panel.py apply 2>&1); then
              gh issue close "$ISSUE_NUMBER" --reason "not planned" --comment "요청을 반영하지 않았습니다: $result"; exit 0
            fi
            git add release
            git commit -q -m "Panel request: $result"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              gh issue close "$ISSUE_NUMBER" --comment "$result"; exit 0
            fi
            sleep $((attempt * 3 + RANDOM % 5))
          done
          gh issue comment "$ISSUE_NUMBER" --body "다른 변경과 계속 겹쳐서 반영하지 못했습니다. 다시 요청해 주세요."
          exit 1

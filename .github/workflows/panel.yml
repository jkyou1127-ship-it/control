name: Panel request

# 평가단의 요청을 release/ 에 반영한다. 기다리는 시간은 scripts/panel.py 의 WAITS 에 있다.
#   실험실 기능 정식 추가  10분 뒤 알파 사용자 모두에게 켜고, 그로부터 20분 뒤 정식 기능으로
#   빌드 정식 추가        30분 뒤 정식 채널에 (요청한 순간의 알파 빌드)
#   숨김 · 복귀           바로
# 요청은 두 길로 온다.
#   relay  앱 → 중계 서버(relay/worker.js, 평가단 코드 확인) → 이 워크플로 실행. 취소하려면 이 실행을 취소한다.
#   issue  GitHub 이슈(중계 서버를 쓰지 않을 때). 평가단 계정의 이슈만 받는다. 취소하려면 이슈를 닫는다.
# 요청마다 따로 실행된다. (concurrency 로 줄을 세우면 기다리는 요청이 하나만 남고 나머지가 취소되므로 쓰지 않는다.)
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "build, lab, hide, restore 중 하나"
        required: true
      target:
        description: "빌드 버전 또는 실험실 기능 이름"
        required: true
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  relay:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # 입력값은 명령에 끼워 넣지 않고 환경 변수로만 넘기고, scripts/panel.py 가 모양을 다시 확인한다.
      REQUEST_KIND: ${{ inputs.kind }}
      REQUEST_TARGET: ${{ inputs.target }}
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the request
        id: check
        run: python3 scripts/panel.py check >> "$GITHUB_OUTPUT"

      - name: Reject
        if: steps.check.outputs.ok != 'true'
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "요청을 반영하지 않았습니다: $REASON" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Prepare
        env:
          PLAN: ${{ steps.check.outputs.summary }}
        run: |
          echo "$PLAN" >> "$GITHUB_STEP_SUMMARY"
          # 기다리는 사이에 새 알파가 올라와도 요청한 그 빌드를 올릴 수 있게 지금 알파 빌드를 떠 둔다.
          mkdir -p "$RUNNER_TEMP/alpha"
          cp release/alpha/version.json release/alpha/ControlPad.apk "$RUNNER_TEMP/alpha/"
          echo "ALPHA_SNAPSHOT=$RUNNER_TEMP/alpha" >> "$GITHUB_ENV"
          # 반영 중에 저장소를 최신으로 되돌리므로, 반영 스크립트는 따로 복사해 둔 것을 쓴다.
          cp scripts/panel_apply.sh "$RUNNER_TEMP/"

      - name: Wait
        run: sleep "${{ steps.check.outputs.wait1 }}"

      - name: Apply to all alpha users
        if: steps.check.outputs.staged == 'true'
        run: |
          result=$(bash "$RUNNER_TEMP/panel_apply.sh" alpha) || { echo "요청을 반영하지 않았습니다: $result" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "$result" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for stable
        if: steps.check.outputs.staged == 'true'
        run: sleep "${{ steps.check.outputs.wait2 }}"

      - name: Apply
        run: |
          result=$(bash "$RUNNER_TEMP/panel_apply.sh") || { echo "요청을 반영하지 않았습니다: $result" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "$result" >> "$GITHUB_STEP_SUMMARY"

  promote:
    if: >-
      github.event_name == 'issues' && (startsWith(github.event.issue.title, '[정식 요청]') ||
      startsWith(github.event.issue.title, '[숨김 요청]') || startsWith(github.event.issue.title, '[복귀 요청]'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # 이슈 제목과 작성자는 누구나 정할 수 있는 값이다. 명령에 끼워 넣지 않고 환경 변수로만 넘긴다.
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the request
        id: check
        run: python3 scripts/panel.py check >> "$GITHUB_OUTPUT"

      - name: Reject
        if: steps.check.outputs.ok != 'true'
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          gh issue close "$ISSUE_NUMBER" --reason "not planned" --comment "요청을 반영하지 않았습니다: $REASON"

      - name: Prepare
        if: steps.check.outputs.ok == 'true'
        env:
          PLAN: ${{ steps.check.outputs.summary }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "요청을 받았습니다. $PLAN 취소하려면 그 전에 이 이슈를 닫으세요."
          mkdir -p "$RUNNER_TEMP/alpha"
          cp release/alpha/version.json release/alpha/ControlPad.apk "$RUNNER_TEMP/alpha/"
          echo "ALPHA_SNAPSHOT=$RUNNER_TEMP/alpha" >> "$GITHUB_ENV"
          cp scripts/panel_apply.sh "$RUNNER_TEMP/"

      - name: Wait
        if: steps.check.outputs.ok == 'true'
        run: sleep "${{ steps.check.outputs.wait1 }}"

      - name: Apply to all alpha users
        id: alpha
        if: steps.check.outputs.ok == 'true' && steps.check.outputs.staged == 'true'
        run: |
          if [ "$(gh issue view "$ISSUE_NUMBER" --json state --jq .state)" != "OPEN" ]; then
            echo "cancelled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if result=$(bash "$RUNNER_TEMP/panel_apply.sh" alpha); then
            gh issue comment "$ISSUE_NUMBER" --body "$result. 20분 뒤에 정식 기능으로 올립니다."
          else
            gh issue close "$ISSUE_NUMBER" --reason "not planned" --comment "요청을 반영하지 않았습니다: $result"
            echo "cancelled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for stable
        if: steps.check.outputs.ok == 'true' && steps.check.outputs.staged == 'true' && steps.alpha.outputs.cancelled != 'true'
        run: sleep "${{ steps.check.outputs.wait2 }}"

      - name: Apply
        if: steps.check.outputs.ok == 'true' && steps.alpha.outputs.cancelled != 'true'
        run: |
          if [ "$(gh issue view "$ISSUE_NUMBER" --json state --jq .state)" != "OPEN" ]; then
            echo "이슈가 닫혀서 취소되었습니다"
            exit 0
          fi
          if result=$(bash "$RUNNER_TEMP/panel_apply.sh"); then
            gh issue close "$ISSUE_NUMBER" --comment "$result"
          else
            gh issue close "$ISSUE_NUMBER" --reason "not planned" --comment "요청을 반영하지 않았습니다: $result"
          fi

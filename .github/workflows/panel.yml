name: Panel request

# 평가단의 정식 추가 요청: 앱의 '실험실 · 평가단' 화면이 여는 이슈.
# 평가단의 요청이면 5분 기다렸다가 release/ 를 고쳐 정식에 반영한다. 그 사이에 이슈를 닫으면 취소된다.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# 요청이 겹치면 차례로 처리한다.
concurrency:
  group: panel-request
  cancel-in-progress: false

jobs:
  promote:
    if: startsWith(github.event.issue.title, '[정식 요청]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # 이슈 제목과 작성자는 누구나 정할 수 있는 값이다. 명령에 끼워 넣지 않고 환경 변수로만 넘긴다.
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the request
        id: check
        run: python3 scripts/panel.py check >> "$GITHUB_OUTPUT"

      - name: Reject
        if: steps.check.outputs.ok != 'true'
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          gh issue close "$ISSUE_NUMBER" --reason "not planned" --comment "요청을 반영하지 않았습니다: $REASON"

      - name: Announce
        if: steps.check.outputs.ok == 'true'
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "요청을 받았습니다. 5분 뒤에 $SUMMARY 올립니다. 취소하려면 그 전에 이 이슈를 닫으세요."

      - name: Wait five minutes
        if: steps.check.outputs.ok == 'true'
        run: sleep 300

      - name: Apply
        if: steps.check.outputs.ok == 'true'
        run: |
          if [ "$(gh issue view "$ISSUE_NUMBER" --json state --jq .state)" != "OPEN" ]; then
            echo "이슈가 닫혀서 취소되었습니다"
            exit 0
          fi
          # 기다리는 동안 새 빌드가 올라왔을 수 있으니 최신 상태에서 다시 확인한다.
          git pull --ff-only
          if ! result=$(python3 scripts/panel.py apply 2>&1); then
            gh issue close "$ISSUE_NUMBER" --reason "not planned" --comment "요청을 반영하지 않았습니다: $result"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release
          git commit -m "Panel request #$ISSUE_NUMBER: promote to stable"
          git push
          gh issue close "$ISSUE_NUMBER" --comment "$result"

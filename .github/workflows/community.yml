name: Community index

# 레이아웃 커뮤니티: 중계 서버가 community/layouts/ 에 레이아웃을 올리면 목록(community/index.json)을 새로 만든다.
on:
  push:
    paths:
      - "community/layouts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build index and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            python3 scripts/community_index.py
            if git diff --quiet -- community/index.json; then echo "목록이 그대로입니다"; exit 0; fi
            git add community/index.json
            git commit -q -m "Community: 목록 갱신"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1
